<!doctype html>
<html>
  <head>
    <title>Sistem Informasi Bahan Ajar</title>

    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <div id="app" class="container">
      <h1>Sistem Informasi Bahan Ajar</h1>

      <nav class="top-menu">
        <button
          :class="{
        activeTab:
        tab=='stok'
    }"
          @click="tab='stok'"
        >
          <i class="fa-solid fa-box"></i>
          Halaman Stok
        </button>

        <button
          :class="{
        activeTab:
        tab=='tracking'
    }"
          @click="tab='tracking'"
        >
          <i class="fa-solid fa-truck-fast"></i>
          Tracking DO
        </button>
      </nav>

      <hr />

      <section v-show="tab=='stok'">
        <ba-stock-table
          :items="state.stok"
          :upbjj="state.upbjjList"
          :kategori="state.kategoriList"
        >
        </ba-stock-table>
      </section>

      <section v-show="tab=='tracking'">
        <do-tracking
          :tracking="state.tracking"
          :paket="state.paket"
          :pengiriman="state.pengirimanList"
        >
        </do-tracking>
      </section>
    </div>

    <script src="js/services/api.js"></script>

    <script src="js/components/status-badge.js"></script>

    <script src="js/components/app-modal.js"></script>

    <script src="js/components/stock-table.js"></script>

    <script src="js/components/do-tracking.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
